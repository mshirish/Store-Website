{% extends 'base.html' %}
{% block title %}Confirming payment — Our Store{% endblock %}
{% block extra_head %}<meta http-equiv="refresh" content="3">{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto text-center py-8">

  <div class="bg-amber-50 border border-amber-200 rounded-2xl p-8 mb-6">
    <p class="text-xl font-bold text-amber-800 mb-2">Confirming your payment&hellip;</p>
    <p class="text-amber-700 text-sm mb-3">
      This usually takes a few seconds. This page will update automatically.
    </p>
    <button onclick="location.reload()"
            class="text-sm text-amber-800 underline hover:no-underline">
      Refresh now
    </button>
  </div>

</div>
{% endblock %}
